name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET 10 — Windows 10 1607+ / Windows 11
          - name: win-x64
            rid: win-x64
            tfm: net10.0
            langversion: ""
          - name: win-x86
            rid: win-x86
            tfm: net10.0
            langversion: ""
          - name: win-arm64
            rid: win-arm64
            tfm: net10.0
            langversion: ""
          # .NET 6 — legacy, Windows 7 SP1 / 8 / 8.1
          - name: win-legacy-x64
            rid: win-x64
            tfm: net6.0
            langversion: latest
          - name: win-legacy-x86
            rid: win-x86
            tfm: net6.0
            langversion: latest
          # Linux / macOS
          - name: linux-x64
            rid: linux-x64
            tfm: net10.0
            langversion: ""
          - name: linux-arm64
            rid: linux-arm64
            tfm: net10.0
            langversion: ""
          - name: osx-x64
            rid: osx-x64
            tfm: net10.0
            langversion: ""
          - name: osx-arm64
            rid: osx-arm64
            tfm: net10.0
            langversion: ""
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Build CLI utilities
        shell: pwsh
        run: |
          $projects = @(
            'src/Applications/UUPDownload/UUPDownload.csproj',
            'src/Applications/UUPMediaConverter/UUPMediaConverter.csproj'
          )
          $publishDir = '${{ github.workspace }}/artifacts/${{ matrix.name }}/CLIs/'
          $common = @(
            '/t:restore;publish',
            '/p:Configuration=Release',
            '/p:RuntimeIdentifier=${{ matrix.rid }}',
            '/p:UUPMediaTargetFramework=${{ matrix.tfm }}',
            '/p:SelfContained=true',
            '/p:PublishSingleFile=true',
            '/p:PublishTrimmed=false',
            "/p:PublishDir=$publishDir"
          )
          # net6.0 needs LangVersion=latest: a few files use language features
          # newer than the C# 10 default of that target framework.
          if ('${{ matrix.langversion }}' -ne '') {
            $common += '/p:LangVersion=${{ matrix.langversion }}'
          }
          foreach ($project in $projects) {
            Write-Host "==> Publishing $project for ${{ matrix.name }}"
            dotnet msbuild $project @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create PDB Output Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/artifacts/${{ matrix.name }}/PDBs" | Out-Null

      - name: Move PDBs
        shell: pwsh
        run: |
          Get-ChildItem "${{ github.workspace }}/artifacts/${{ matrix.name }}/CLIs/*.pdb" -ErrorAction SilentlyContinue |
            Move-Item -Destination "${{ github.workspace }}/artifacts/${{ matrix.name }}/PDBs/"

      - name: Upload artifact (Binaries)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ matrix.name }}-binaries
          path: ${{ github.workspace }}/artifacts/${{ matrix.name }}/CLIs

      - name: Upload artifact (Symbols)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ matrix.name }}-symbols
          path: ${{ github.workspace }}/artifacts/${{ matrix.name }}/PDBs
